[project]
name = "researchpaperassistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sudhamsh1308", email = "sudhamsh1308@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.17.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "loguru>=0.7.3",
    "pymupdf>=1.28.0",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
]

[project.scripts]
researchpaperassistant = "researchpaperassistant:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
